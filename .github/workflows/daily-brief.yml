name: Build daily workout brief
on:
  schedule:
    # 10:15 UTC = 5:15 AM Central (CDT). Runs before your Shortcut fires.
    - cron: "15 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today.txt
        run: python scripts/build_today.py
      - name: Commit
        run: |
          git config user.name "iron-ledger-bot"
          git config user.email "actions@github.com"
          git add today.txt data/
          git diff --cached --quiet || git commit -m "Daily brief $(date -u +%F)"
          git push
