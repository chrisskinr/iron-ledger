name: Build daily workout brief
on:
  # Schedule retired 2026-08-29: Achilles (local openclaw agent) now builds and
  # delivers the morning brief at 6:00 AM via ntfy. Manual dispatch kept as a
  # fallback if the local agent is down.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today.txt
        run: python scripts/build_today.py
      - name: Commit
        run: |
          git config user.name "iron-ledger-bot"
          git config user.email "actions@github.com"
          git add today.txt data/
          git diff --cached --quiet || git commit -m "Daily brief $(date -u +%F)"
          git push
