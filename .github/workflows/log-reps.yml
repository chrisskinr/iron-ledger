name: Log reps
on:
  repository_dispatch:
    types: [log]

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append log entry
        env:
          LIFT: ${{ github.event.client_payload.lift }}
          WEIGHT: ${{ github.event.client_payload.weight }}
          REPS: ${{ github.event.client_payload.reps }}
        run: python scripts/append_log.py
      - name: Commit
        run: |
          git config user.name "iron-ledger-bot"
          git config user.email "actions@github.com"
          git add data/log.json
          git diff --cached --quiet || git commit -m "Rep log: ${{ github.event.client_payload.lift }} ${{ github.event.client_payload.weight }}x${{ github.event.client_payload.reps }}"
          git push
